<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Hi, I'm <span id="name"></span></h1>
    <p>Welcome to my first JavaScript website.</p>
  </header>

  <main>
    <h2>My variables</h2>
    <ul>
      <li>Name (string): <strong id="name-output"></strong></li>
      <li>Age (number): <strong id="age-output"></strong></li>
      <li>Studying web design (boolean): <strong id="student-output"></strong></li>
    </ul>
    <p id="message"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
